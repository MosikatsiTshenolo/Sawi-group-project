<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Password Reset | SAWI</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f1f5f9; color: #1e293b; font-family: Arial, sans-serif; }
        header { padding: 22px; background: #123b5d; color: white; text-align: center; }
        header h1, header p { color: white; font-weight: 700; }
        main { width: min(92% , 480px); margin: 36px auto; padding: 28px; border-radius: 10px; background: white; box-shadow: 0 4px 16px #00000012; }
        h2 { color: #123b5d; }
        label { display: block; margin: 16px 0 6px; font-weight: 700; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 5px; font: inherit; }
        button { margin-top: 20px; padding: 12px 18px; border: 0; border-radius: 5px; background: #123b5d; color: white; font-weight: 700; cursor: pointer; }
        .notice { padding: 12px; border-radius: 5px; background: #e8f5ed; color: #145b43; }
        a { color: #123b5d; }
    </style>
</head>
<body>
<header><h1>SAWI</h1><p>Student Assessment and Wellness Integrator</p></header>
<main>
    <h2>Request a password reset</h2>
    <p>Reset requests are reviewed by an administrator. If approved, you will receive an email with a one-time reset link.</p>
    <p class="notice" th:if="${requestSubmitted}">If the account is eligible, the request has been sent to the administrator for review.</p>
    <form th:action="@{/password-reset/request}" method="post">
        <label for="usernameOrEmail">Username or email</label>
        <input id="usernameOrEmail" name="usernameOrEmail" autocomplete="username" required>
        <button type="submit">Submit request</button>
    </form>
    <p><a th:href="@{/login}">Back to login</a></p>
</main>
</body>
</html>
