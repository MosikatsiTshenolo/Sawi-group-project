<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SAWI</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f1f5f9; color: #1e293b; font-family: Arial, sans-serif; }
        header { padding: 22px; background: #123b5d; color: white; text-align: center; }
        header h1, header p { color: white; font-weight: 700; }
        main { width: min(92% , 480px); margin: 36px auto; padding: 28px; border-radius: 10px; background: white; box-shadow: 0 4px 16px #00000012; }
        h2 { color: #123b5d; }
        label { display: block; margin: 16px 0 6px; font-weight: 700; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 5px; font: inherit; }
        button { margin-top: 20px; padding: 12px 18px; border: 0; border-radius: 5px; background: #123b5d; color: white; font-weight: 700; cursor: pointer; }
        .error { padding: 12px; border-radius: 5px; background: #fee2e2; color: #991b1b; }
        a { color: #123b5d; }
    </style>
</head>
<body>
<header><h1>SAWI</h1><p>Student Assessment and Wellness Integrator</p></header>
<main>
    <h2>Choose a new password</h2>
    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <form th:if="${tokenValid}" th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <label for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" type="password" minlength="8" maxlength="100" autocomplete="new-password" required>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="100" autocomplete="new-password" required>
        <button type="submit">Reset password</button>
    </form>
    <p class="error" th:if="${!tokenValid and errorMessage == null}">This reset link is invalid or expired. Request a new password reset.</p>
    <p><a th:href="@{/login}">Back to login</a></p>
</main>
</body>
</html>
