spring.application.name=SAWI

# ==========================================
# MYSQL DATABASE
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/sawi_db?useSSL=false&serverTimezone=Africa/Johannesburg&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=Sawi@2026

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# SERVER
# ==========================================

server.port=8080

# ==========================================
# OPTIONAL EMAIL (set through environment variables)
# ==========================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Optional OpenAI-compatible chat provider for Intelligent Triage.
# Student text, selected mood and stress are sent only after consent in the chat.
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}